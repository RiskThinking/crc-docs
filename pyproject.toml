[project]
name = "crc-docs"
version = "0.1.0"
description = "Notebooks, pipelines, and examples for crc-sdk and crc-framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "kaleido>=0.2.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0,<7",
    "crc-sdk[raster,netcdf,zarr]>=1.0.0a2,<2",
    "crc-framework>=1.0.0a2,<2",
    "duckdb>=1.4,<2",
    "numpy>=2",
]

[project.optional-dependencies]
velo = [
    "velo-sdk==0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.uv.sources]
# decode_curves ships in crc-sdk 1.0.0a2; until it is on PyPI, use its pull request.
crc-sdk = { git = "https://github.com/RiskThinking/crc-sdk", rev = "1adf2a22a545975ebeb9939faf1be916651fb121" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks"]
