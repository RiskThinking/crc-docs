[project]
name = "crc-docs"
version = "0.1.0"
description = "Notebooks, pipelines, and examples for crc-sdk and crc-framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "kaleido>=0.2.1",
    "pandas>=3.0.5",
    "plotly>=6.9.0,<7",
    "crc-sdk[agriculture,zarr,raster,netcdf,geometry]>=0.11.1,<1",
]

[project.optional-dependencies]
velo = [
    "velo-sdk==0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks"]
