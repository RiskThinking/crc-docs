name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install locked environment
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check pipelines tests tools
          uv run ruff format --check pipelines tests tools

      - name: Offline tests (saved notebook outputs, pipelines)
        run: uv run pytest -q

      - name: Package skills for upload
        run: uv run python tools/package_skills.py

      - name: Upload skill packages
        uses: actions/upload-artifact@v6
        with:
          name: skills
          path: dist/skills

