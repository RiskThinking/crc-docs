name: Validate agent skills

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".claude/skills"
      - ".mcp.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/validate-skills.yml"
  push:
    branches:
      - main
    paths:
      - ".agents/skills/**"
      - ".claude/skills"
      - ".mcp.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Validate Agent Skills
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -L .claude/skills ]] || [[ "$(readlink .claude/skills)" != "../.agents/skills" ]]; then
            echo ".claude/skills must point to ../.agents/skills" >&2
            exit 1
          fi
          if [[ "$(cat CLAUDE.md)" != "@AGENTS.md" ]]; then
            echo "CLAUDE.md must import AGENTS.md via a single '@AGENTS.md' line" >&2
            exit 1
          fi
          python -m json.tool .mcp.json >/dev/null
          shopt -s nullglob
          skills=(.agents/skills/*)
          if (( ${#skills[@]} == 0 )); then
            echo "No skills found under .agents/skills" >&2
            exit 1
          fi
          for skill in "${skills[@]}"; do
            uvx --from "skills-ref==0.1.1" agentskills validate "$skill"
            name="$(basename "$skill")"
            if ! grep -q "$name" AGENTS.md; then
              echo "AGENTS.md is missing an entry for skill '$name'" >&2
              exit 1
            fi
          done
